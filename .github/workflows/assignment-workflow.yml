# Tests what a student does every week, rather than what they do once in September.
# Asserts on the CONTENT of the rendered documents, not on exit codes: every LaTeX
# route exits 0 while silently replacing characters it has no glyph for.

name: Assignment workflow

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays. This repo can sit unchanged for months and everything that breaks it
    # is upstream, so the push trigger alone would never fire.
    - cron: "0 15 * * 1"
  workflow_dispatch:

concurrency:
  group: assignment-workflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    # Git Bash on the Windows runner, so one set of commands works everywhere.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      # check-setup-mds.sh decides whether a machine is Windows from these, and got it
      # wrong once when Git Bash changed the triplet its bash reports. Logging them
      # means the next such change shows up here rather than in a student's screenshot.
      - name: What shell is this
        run: |
          echo "uname -s : $(uname -s)"
          echo "OSTYPE   : $OSTYPE"
          bash --version | head -1

      # ---------------------------------------------------------------- tools --
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Scoped to the root lock file: the default `**/uv.lock` also matches
          # mds-demo-assignment/uv.lock, which this workflow never installs, so a
          # change there would rekey the cache for no reason.
          cache-dependency-glob: uv.lock

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          # renv.lock declares 4.6.1; a different minor makes renv warn on every run.
          r-version: "4.6"

      # Not a Python package, so uv cannot install it. The guides say so too.
      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: "3.10.2"

      - name: Install TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      # Through R's tinytex rather than tlmgr directly: TeX Live ships `tlmgr.bat` on
      # Windows and `tlmgr` elsewhere. Same route the install guides give students.
      - name: Add the LaTeX packages the install guides list
        run: |
          Rscript -e 'if (!requireNamespace("tinytex", quietly = TRUE)) install.packages("tinytex", repos = "https://cloud.r-project.org")'
          Rscript -e 'pkgs <- readLines("ci/tlmgr-packages.txt"); tinytex::tlmgr_install(pkgs); missing <- pkgs[!tinytex::check_installed(pkgs)]; if (length(missing)) stop("tlmgr did not install: ", paste(missing, collapse = ", "))'

      # ------------------------------------------------------------- the repo --
      # --locked also proves pyproject.toml has not drifted from uv.lock.
      - name: uv sync --locked
        run: uv sync --locked

      - name: Install the browser the WebPDF route needs
        run: uv run playwright install --with-deps chromium

      - name: Restore the R library
        run: Rscript -e 'renv::restore(prompt = FALSE)'

      # ------------------------------------------------- the repo's contract ---
      # "What your repo must contain" in docs/assignment-workflow-uv.md makes claims about
      # the file assignment repos are copied from. If they stop being true, every
      # derived repo inherits it.
      - name: Check the pyproject contract
        run: make check-contract

      # Reads files rather than rendering, so one platform is enough. Catches a
      # fixture or target renamed in the code and not in the prose.
      - name: Check the docs still describe the repo
        if: matrix.os == 'ubuntu-latest'
        run: make check-docs

      # The claim that justifies jupyterlab being a real dependency rather than a dev
      # one: the server extensions have to resolve in the kernel's own prefix.
      - name: JupyterLab extensions resolve
        run: |
          uv run jupyter --version
          uv run jupyter server extension list 2>&1 | tee /tmp/ext.txt
          for ext in jupyterlab_git jupytext jupyterlab_spellchecker; do
            grep -q "$ext" /tmp/ext.txt || { echo "missing server extension: $ext"; exit 1; }
          done
          # The name also appears in jupyter's "Validating ..." line, so the greps
          # above pass on a disabled or erroring extension. These do not.
          if grep -qE "Error loading server extension|Validation failed|^ *X " /tmp/ext.txt; then
            echo "a server extension is installed but does not load"; exit 1
          fi

      # ------------------------------------------------------------- renders ---
      # `render`, not `all`: `all` already wraps this in -k and swallows the exit code,
      # so calling the inner target keeps both flags visible here. -k so one broken
      # route does not hide the others, and the exit code is ignored because one route
      # is expected to fail. `make check` is the gate that knows which.
      - name: Render every route
        run: make -k render || true

      - name: Show which outputs were produced
        run: ls -la render-checks/check-*.pdf render-checks/check-*.html || true

      - name: Check the rendered documents contain what they should
        run: make check

      # Linux only: the committed table is one platform's answer and the WebPDF row
      # differs on Windows. This is what makes "generated, do not edit by hand" true.
      - name: Check docs/render-matrix.md still matches the renders
        if: matrix.os == 'ubuntu-latest'
        run: make matrix-check

      # Into the job summary rather than the log: it is a markdown table, and
      # comparing three platforms should not mean opening three logs.
      - name: Publish the feature matrix for this platform
        if: always()
        run: |
          echo "## What rendered on ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          make matrix >> "$GITHUB_STEP_SUMMARY" || true

      # "Autograding and Docker" in the guide: an image built with `uv sync --no-dev`
      # still needs a Python kernel, which is why ipykernel is named explicitly. Runs
      # last because it removes the dev group, and pypdf lives there.
      - name: A Python kernel survives uv sync --no-dev
        run: |
          uv sync --no-dev
          # --no-dev on every command too: a bare `uv run` re-syncs and puts the dev
          # group back, so the environment under test would be the full one.
          uv run --no-dev python -c "import otter, pandas"
          uv run --no-dev jupyter kernelspec list 2>&1 | tee /tmp/kernels.txt
          grep -q python3 /tmp/kernels.txt || { echo "no Python kernel after --no-dev"; exit 1; }

      # So the setup check fetches THIS branch's check-python-installs.sh rather than
      # the published copy. That script is the first MDS code a new student runs.
      - name: Serve this branch to the setup check
        run: |
          uv run --no-sync python -m http.server 8127 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/http.pid"
          for _ in $(seq 1 30); do
            curl -Ssf http://127.0.0.1:8127/check-python-installs.sh -o /dev/null && break
            sleep 1
          done
          curl -Ssf http://127.0.0.1:8127/check-python-installs.sh -o /dev/null \
            || { echo "the local server never came up"; cat "$RUNNER_TEMP/http.log"; exit 1; }

      # Every platform, not just Linux: the script has three substantially different
      # platform branches, and three student-facing defects shipped while two of them
      # never ran here.
      - name: Run the setup check the way a student does
        run: |
          # Point the clone at this checkout so the PR's code is what runs. `checkout -B`
          # because actions/checkout leaves a detached HEAD on pull_request events, and
          # cloning a detached repository checks out nothing at all.
          git -C "$GITHUB_WORKSPACE" checkout -q -B ci-under-test
          cd "$RUNNER_TEMP"
          export MDS_PROJECT_URL="$GITHUB_WORKSPACE"
          export MDS_BASE_URL="http://127.0.0.1:8127"
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Python's pty is Unix-only, so the prompts cannot be driven here. Without
            # a terminal both default to no, skipping the Python and document-export
            # sections but still exercising the OS detection and program checks, which
            # is where the platform branches live. The rest is covered on Linux/macOS.
            bash "$GITHUB_WORKSPACE/check-setup-mds.sh" < /dev/null || true
          else
            # A pseudo-terminal, because both prompts are guarded by `[ -t 0 ]` and
            # default to no without one. ci/run-setup-check.py answers each prompt only
            # after seeing it; feeding a pty from a plain pipe misaligns the answers.
            python3 "$GITHUB_WORKSPACE/ci/run-setup-check.py" \
              "$GITHUB_WORKSPACE/check-setup-mds.sh" || true
          fi
          echo "----- the log a student would submit -----"
          cat check-setup-mds.log

      - name: The setup check must find its fixtures and keep the log clean
        run: |
          log=$(cat "$RUNNER_TEMP/check-setup-mds.log")

          # The log used to carry escape codes, so an instructor opening a submitted
          # log read `^[[0;33m## System programs^[[0m`.
          if printf '%s' "$log" | grep -q "$(printf '\033')"; then
            echo "FAIL: the log a student submits still contains terminal escape codes"
            exit 1
          fi

          # ---- the platform branch actually taken -------------------------------
          # Regression test: Git Bash began reporting OSTYPE=cygwin, the msys test
          # stopped matching, and every Windows check fell through to the Linux branch.
          if grep -q "Operating system verison could not be detected" <<< "$log"; then
            echo "FAIL: the script did not recognise this platform, so it used the wrong"
            echo "      branch for every check below. The shell it saw:"
            grep "^Shell:" <<< "$log"
            exit 1
          fi
          case "$RUNNER_OS" in
            Windows)
              grep -qE "^Windows (10|11)" <<< "$log" \
                || { echo "FAIL: the Windows branch was not taken"; grep "^Shell:" <<< "$log"; exit 1; }
              # tlmgr is `tlmgr.bat` on Windows; TinyTeX is installed above, so an OK
              # here proves the Windows-specific lookup ran.
              grep -q "^OK.*tlmgr" <<< "$log" \
                || { echo "FAIL: tlmgr not found; the tlmgr.bat lookup did not run"; exit 1; }
              ;;
            macOS)
              grep -q "ProductName" <<< "$log" \
                || { echo "FAIL: the macOS branch was not taken"; exit 1; }
              ;;
            Linux)
              grep -q "Operating System:" <<< "$log" \
                || { echo "FAIL: the Linux branch was not taken"; exit 1; }
              ;;
          esac

          # A fixture named by the script but absent from the project -- the exact
          # shape of a rename that once went unnoticed for three commits.
          if grep -q "could not be tested since check-" <<< "$log"; then
            echo "FAIL: the script names a fixture the project does not contain:"
            grep "could not be tested since check-" <<< "$log"
            exit 1
          fi

          # Neither is installed on any runner, so both are MISSING everywhere and the
          # note saying those two are ignorable has to be there. An implication rather
          # than a flat assertion, so installing one later makes this a no-op.
          if grep -Eiq "^MISSING.*(rstudio|positron)" <<< "$log"; then
            grep -q "^NOTE .*marked MISSING above" <<< "$log" \
              || { echo "FAIL: RStudio/Positron reported MISSING with no note saying that"
                   echo "      an application that opens can be ignored"; exit 1; }
          fi

          # ---- everything below needed the prompts answered ---------------------
          # Windows took the no-terminal path and never set the project up. Say so
          # rather than letting a green Windows job imply more than it checked.
          if [ "$RUNNER_OS" = "Windows" ]; then
            grep -q "no terminal attached" <<< "$log" \
              || { echo "FAIL: expected the no-terminal path on Windows"; exit 1; }
            echo "Windows: platform branch and system-program checks verified."
            echo "NOT verified here (no pty): the Python package and document-export"
            echo "sections. Those are covered on Linux and macOS."
            exit 0
          fi

          # The routes MDS asks students to use, rather than the script's own
          # "one route is enough" verdict.
          for route in "quarto Typst PDF-generation was successful" \
                       "quarto LaTeX PDF-generation was successful"; do
            grep -q "$route" <<< "$log" || { echo "FAIL: $route"; exit 1; }
          done

          # Nothing about the environment reaches the log unless the student says yes.
          grep -q "Not recorded. You were asked" <<< "$log" \
            || { echo "FAIL: the environment section did not default to not-recorded"; exit 1; }

          # From this branch's copy, not the published one -- what MDS_BASE_URL buys.
          grep -q "Python installations already on this computer" <<< "$log" \
            || { echo "FAIL: the Python installation report did not run"; exit 1; }

          echo "the setup check found its fixtures, rendered through Quarto, and recorded"
          echo "no environment variables"

      # Started with `uv run`, so leaving it alive leaves a uv process holding the
      # cache for the rest of the job -- including the post-job `uv cache prune`, which
      # once hung to its 300s timeout.
      - name: Stop the local server
        if: always()
        run: |
          pid=$(cat "$RUNNER_TEMP/http.pid" 2>/dev/null || true)
          [ -n "$pid" ] && kill "$pid" 2>/dev/null || true
          echo "stopped ${pid:-none}"

      - name: Upload the rendered documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-${{ matrix.os }}
          path: |
            render-checks/check-*.pdf
            render-checks/check-*.html
          # error, not warn: @actions/glob will not let a `*` cross a `/`, so an
          # unprefixed glob silently matches nothing. Zero rendered documents is never
          # a correct outcome.
          if-no-files-found: error
