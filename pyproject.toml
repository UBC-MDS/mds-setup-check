[project]
name = "mds-setup-check"
version = "2026.1"
description = "Verification project for the UBC MDS software stack installation."
readme = "README.md"
requires-python = ">=3.14"

# Every package the MDS installation guides expect a student to end up with.
# `ipykernel` is listed explicitly even though `jupyterlab` pulls it in: an
# autograding image built with `uv sync --no-dev` must still have a Python
# kernel, and this is the file other course repos are copied from.
dependencies = [
    "ipykernel>=7",
    "jupyterlab>=4.6",
    "jupyterlab-git>=0.54",
    "jupyterlab-spellchecker>=0.9",
    "jupytext>=1.19",
    "nbconvert[webpdf]>=7.17",
    "otter-grader>=7",
    "pandas>=3",
    "playwright>=1.62",
]

[tool.uv]
package = false

# Tools the checks in ci/ need, which students do not.
#
# This group also gives the repository a real difference between `uv sync` and
# `uv sync --no-dev`, which matters because assignment-workflow-uv.md warns about
# that flag: an autograding image built with --no-dev must still have a Python
# kernel. Without a dev group there is nothing here to demonstrate the trap on.
[dependency-groups]
dev = [
    "pypdf>=6",
]
