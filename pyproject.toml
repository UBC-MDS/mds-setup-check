[project]
name = "mds-setup-check"
version = "2026.1"
description = "Verification project for the UBC MDS software stack installation."
readme = "README.md"
requires-python = ">=3.14"

# Every package the MDS installation guides expect a student to end up with.
# `ipykernel` is listed explicitly even though `jupyterlab` pulls it in: an
# autograding image built with `uv sync --no-dev` must still have a Python
# kernel, and this is the file other course repos are copied from.
dependencies = [
    "ipykernel>=7",
    "jupyterlab>=4.6",
    "jupyterlab-git>=0.54",
    "jupyterlab-spellchecker>=0.9",
    "jupytext>=1.19",
    "nbconvert[webpdf]>=7.17",
    "otter-grader>=7",
    "pandas>=3",
    "playwright>=1.62",
]

[tool.uv]
package = false
