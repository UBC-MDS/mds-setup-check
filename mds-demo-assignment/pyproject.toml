[project]
name = "dsci-521-lab0"
version = "0.1.0"
requires-python = ">=3.14"

# Deliberately shorter than the root pyproject.toml of mds-setup-check. That one
# declares every package the MDS install guides expect a student to end up with,
# because its job is to check the install. An assignment declares what the assignment
# uses, and nothing else. See §3 of ../assignment-workflow-uv.md.
#
#   ipykernel    a kernel, named explicitly rather than left to arrive with
#                jupyterlab, so `uv sync --no-dev` still leaves one behind
#   jupyterlab   a real dependency, not a dev one: Jupyter server extensions only
#                work in the same environment prefix as the kernel
#   otter-grader students run grader.check() in the notebook
#   pandas       the assignment builds a small table with it
#   matplotlib   the assignment draws one figure
dependencies = [
    "ipykernel>=7",
    "jupyterlab>=4.6",
    "matplotlib>=3.10",
    "otter-grader>=7",
    "pandas>=3",
]

[tool.uv]
package = false
